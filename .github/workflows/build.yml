name: Build

# Every push builds the Windows installer and keeps it as a downloadable artifact.
# Pushing a tag like v1.2.0 also publishes a GitHub Release, which installed
# copies of Parley pick up through their in-app update check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the tag matches parley/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code_version=$(python -c "from parley.version import VERSION; print(VERSION)")
          if [ "v$code_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION=$code_version in parley/version.py"; exit 1
          fi

      - name: Unit tests
        run: python -m pytest -q

      - name: Speech service smoke test
        run: python -m pytest -q -m live
        continue-on-error: true

      - name: Build app
        run: |
          python packaging/build_support.py
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/parley.spec

      - name: Self-test the built app (speech, image reading, UI files)
        shell: pwsh
        run: |
          $p = Start-Process dist\Parley\Parley.exe -ArgumentList '--selftest', "$PWD\selftest.json", "$PWD\tests\fixtures\dialogue.png" -Wait -PassThru
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if (-not $r.ui_present) { throw "UI files missing from the build" }
          if (-not $r.frozen) { throw "Not running from the frozen build" }
          if ($r.speech_error) { Write-Warning "Speech failed in CI: $($r.speech_error)" }
          if ($r.ocr_available -and $r.ocr_error) { throw "Image reading failed: $($r.ocr_error)" }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = python -c "from parley.version import VERSION; print(VERSION)"
          iscc /DAppVersion=$version packaging\installer.iss
          $hash = (Get-FileHash dist\ParleySetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ParleySetup.exe" | Out-File -Encoding ascii -NoNewline dist\ParleySetup.exe.sha256
          Get-Item dist\ParleySetup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ParleySetup
          path: |
            dist/ParleySetup.exe
            dist/ParleySetup.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/ParleySetup.exe dist/ParleySetup.exe.sha256 \
            --title "Parley ${GITHUB_REF_NAME#v}" --generate-notes
